StudentDTO:
  type: object
  properties:
    name:
      type: string
      example: Niu Lai
    email:
      type: string
      example: niulai@gmail.com
    is_active:
      type: boolean
      default: true
    role:
      type: string
      enum: [ admin, student ]
      example: admin
StudentSummary:
  type: object
  allOf:
    - $ref: "#/StudentDTO"
  properties:
    id:
      type: string
      format: uuid
      example: 461ae67c-2027-479e-ad63-ebe40e5e6942
  required: [id, name, email, role]

CourseDTO:
  type: object
  properties:
    code:
      type: string
      example: PROG2
    name:
      type: string
      example: Programmation Orientée Objet
    description:
      type: string
      example: Course about OOP
Course:
  type: object
  allOf:
    - $ref: "#/CourseDTO"
  properties:
    id:
      type: string
      format: uuid
      example: 206df8ac-d732-4f40-9286-2c1fb5fb43e7
  required: [id, code, name, description]
ExamDTO:
  type: object
  properties:
    courseId:
      type: string
      format: uuid
      example: 206df8ac-d732-4f40-9286-2c1fb5fb43e7
    title:
      type: string
      example: Midterm Exam
    startsAt:
      type: string
      format: date-time
      example: "2026-09-01T09:00:00Z"
    endsAt:
      type: string
      format: date-time
      example: "2026-09-01T11:00:00Z"
  required: [courseId, title, startsAt, endsAt]
Exam:
  type: object
  allOf:
    - $ref: "#/ExamDTO"
  properties:
    id:
      type: string
      format: uuid
      example: c970740e-1386-4388-b5b5-15f2689df843
    locked:
      type: boolean
      description: "True once the exam has an attempt (RG-08)."
      example: false
  required: [id, locked, courseId, title, startsAt, endsAt]

ChoiceDTO:
  type: object
  properties:
    statement:
      type: string
      example: Paris
    isCorrect:
      type: boolean
      example: true
  required: [text, isCorrect]
Choice:
  type: object
  allOf:
    - $ref: "#/ChoiceDTO"
  properties:
    id:
      type: string
      format: uuid
      example: c0be1de2-6663-427b-9c96-9bdd6a733bdb
  required: [id, text, isCorrect]
QuestionDTO:
  type: object
  properties:
    statement:
      type: string
      example: What is the capital of France?
    choices:
      type: array
      minItems: 2
      maxItems: 6
      description: "2-6 choices, exactly one correct (RG-04)."
      items:
        $ref: "#/ChoiceDTO"
  required: [text, choices]
Question:
  type: object
  properties:
    id:
      type: string
      format: uuid
      example: fe66ad26-382f-4a64-aa01-e61e79de8b38
    examId:
      type: string
      format: uuid
      example: c970740e-1386-4388-b5b5-15f2689df843
    text:
      type: string
      example: What is the capital of France?
    choices:
      type: array
      items:
        $ref: "#/Choice"
  required: [id, examId, text, choices]

PublicChoice:
  type: object
  description: "No isCorrect field (RG-07)."
  properties:
    id:
      type: string
      format: uuid
      example: c0be1de2-6663-427b-9c96-9bdd6a733bdb
    text:
      type: string
      example: Paris
  required: [id, text]
QuestionPublic:
  type: object
  description: "Question with no isCorrect field for students"
  properties:
    id:
      type: string
      format: uuid
      example: fe66ad26-382f-4a64-aa01-e61e79de8b38
    text:
      type: string
      example: What is the capital of France?
    choices:
      type: array
      items:
        $ref: "#/PublicChoice"
  required: [id, text, choices]
ExamWithQuestions:
  type: object
  allOf:
    - $ref: "#/Exam"
  properties:
    questions:
      type: array
      items:
        $ref: "#/QuestionPublic"
  required: [questions]

SubmissionDTO:
  type: object
  properties:
    answers:
      type: array
      items:
        type: object
        properties:
          questionId:
            type: string
            format: uuid
            example: fe66ad26-382f-4a64-aa01-e61e79de8b38
          choiceId:
            type: string
            format: uuid
            example: c0be1de2-6663-427b-9c96-9bdd6a733bdb
        required: [questionId, choiceId]
  required: [answers]
Result:
  type: object
  properties:
    id:
      type: string
      format: uuid
      example: beea87b5-b87c-4b6b-8972-9ff70f3e7924
    examId:
      type: string
      format: uuid
      example: c970740e-1386-4388-b5b5-15f2689df843
    studentId:
      type: string
      format: uuid
      example: 461ae67c-2027-479e-ad63-ebe40e5e6942
    score:
      type: number
      example: 8.5
    submittedAt:
      type: string
      format: date-time
      example: "2026-09-01T10:15:00Z"
  required: [id, examId, studentId, score, submittedAt]

Error:
  type: object
  properties:
    title:
      type: string
      example: Ressource not found
    type:
      type: string
      example: "https://example.com/not-found"
    detail:
      type: string
      example: The given path doesn't exist
    status:
      type: integer
      example: 404
