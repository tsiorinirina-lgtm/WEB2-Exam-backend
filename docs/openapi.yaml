openapi: 3.0.3
info:
  title: Exam Hub API
  description: >
    API du gestionnaire d'examens QCM Exam Hub. Deux rôles : administrateur
    (gestion des étudiants, cours, examens, questions et résultats) et
    étudiant (passage des examens, note calculée côté serveur).
    Toute erreur renvoie un objet JSON `{ "message": "..." }`.
  version: 1.0.0
servers:
  - url: http://localhost:3001/api
    description: Serveur de développement

tags:
  - name: Auth
    description: Connexion (publique)
  - name: Students
    description: Gestion des étudiants (admin)
  - name: Courses
    description: Gestion des cours (admin)
  - name: Exams
    description: Gestion des examens et résultats (admin)
  - name: Questions
    description: Questions et choix d'un examen (admin)
  - name: My
    description: Espace étudiant (examens disponibles, soumission, résultats)

paths:
  /auth/login:
    $ref: "./paths/auth/login.yaml#/~1auth~1login"
  /students:
    $ref: "./paths/students.yaml#/~1students"
  /students/{id}:
    $ref: "./paths/students.yaml#/~1students~1{id}"
  /courses:
    $ref: "./paths/courses.yaml#/~1courses"
  /courses/{id}:
    $ref: "./paths/courses.yaml#/~1courses~1{id}"
  /exams:
    $ref: "./paths/exams.yaml#/~1exams"
  /exams/{id}:
    $ref: "./paths/exams.yaml#/~1exams~1{id}"
  /exams/{id}/questions:
    $ref: "./paths/exams.yaml#/~1exams~1{id}~1questions"
  /questions/{id}:
    $ref: "./paths/questions.yaml#/~1questions~1{id}"
  /exams/{id}/results:
    $ref: "./paths/exams.yaml#/~1exams~1{id}~1results"
  /my/exams:
    $ref: "./paths/my.yaml#/~1my~1exams"
  /my/exams/{id}:
    $ref: "./paths/my.yaml#/~1my~1exams~1{id}"
  /my/exams/{id}/submit:
    $ref: "./paths/my.yaml#/~1my~1exams~1{id}~1submit"
  /my/results:
    $ref: "./paths/my.yaml#/~1my~1results"

security:
  - bearerAuth: []

components:
  schemas:
    Student:
      $ref: "./components/schemas.yaml#/schemas/Student"
    Course:
      $ref: "./components/schemas.yaml#/schemas/Course"
    Exam:
      $ref: "./components/schemas.yaml#/schemas/Exam"
    Choice:
      $ref: "./components/schemas.yaml#/schemas/Choice"
    Question:
      $ref: "./components/schemas.yaml#/schemas/Question"
    ExamInput:
      $ref: "./components/schemas.yaml#/schemas/ExamInput"
    QuestionInput:
      $ref: "./components/schemas.yaml#/schemas/QuestionInput"
    MyExam:
      $ref: "./components/schemas.yaml#/schemas/MyExam"
    MyExamDetail:
      $ref: "./components/schemas.yaml#/schemas/MyExamDetail"
    CorrectionLine:
      $ref: "./components/schemas.yaml#/schemas/CorrectionLine"
    Error:
      $ref: "./components/schemas.yaml#/schemas/Error"
  securitySchemes:
    bearerAuth:
      $ref: "./components/securitySchemes.yaml#/securitySchemes/bearerAuth"
