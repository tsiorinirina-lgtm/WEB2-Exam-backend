login:
  post:
    tags: [Auth]
    summary: "Login for users and admin"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              email:
                type: string
                default: niulai@gmail.com
              password:
                type: string
                default: Mamaaa
    responses:
      "200":
        description: User authenticated
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  format: jwt
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMiJ9.4Adcj3UFYqk
                user:
                  $ref: "../../openapi.yaml#/components/schemas/StudentSummary"
      "401":
        description: Credentials invalid
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/Error"
