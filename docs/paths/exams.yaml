/exams:
  get:
    tags: [Exams]
    summary: Liste des examens
    responses:
      "200":
        description: Examens avec leur cours et leurs compteurs
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "../components/schemas.yaml#/schemas/Exam" }
      "401": { $ref: "../components/securitySchemes.yaml#/responses/Unauthorized" }
      "403": { $ref: "../components/securitySchemes.yaml#/responses/ForbiddenAdmin" }
  post:
    tags: [Exams]
    summary: CrÃ©er un examen
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../components/schemas.yaml#/schemas/ExamInput" }
    responses:
      "201":
        description: Examen crÃ©Ã©
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/schemas/Exam" }
      "400":
        description: Champs manquants, cours inconnu ("Course not found") ou dates invalides ("End date must be after start date")
