            schema: { $ref: "../components/schemas.yaml#/schemas/Error" }
      "401": { $ref: "../components/securitySchemes.yaml#/responses/Unauthorized" }
      "403": { $ref: "../components/securitySchemes.yaml#/responses/ForbiddenAdmin" }

