studentsCollection:
  get:
    tags: [Students]
    summary: Get students
    responses:
      "200":
        description: List of students
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../openapi.yaml#/components/schemas/StudentSummary"
      "401":
        description: Missing or invalid token
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
  post:
    tags: [Students]
    summary: Create users
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../openapi.yaml#/components/schemas/StudentDTO"
    responses:
      "201":
        description: Students created
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../openapi.yaml#/components/schemas/StudentSummary"
      "401":
        description: Missing or invalid token
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "422":
        description: Invalid data
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
studentsItem:
  parameters:
    - in: path
      required: true
      name: id
      schema:
        type: string
        format: uuid
        example: 461ae67c-2027-479e-ad63-ebe40e5e6942
  put:
    tags: [Students]
    summary: Modify a student
    requestBody:
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/StudentDTO"
    responses:
      "200":
        description: Student modified successfully
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/StudentSummary"
      "404":
        description: Student not found
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
  delete:
    tags: [Students]
    summary: Deactivate a student
    responses:
      "204":
        description: Student deactivated successfully
      "404":
        description: Student not found
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"