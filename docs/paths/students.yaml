/students:
  get:
    tags: [Students]
    summary: Liste des étudiants
    responses:
      "200":
        description: Tous les étudiants (jamais l'admin, jamais le mot de passe)
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "../components/schemas.yaml#/schemas/Student" }
      "401":
        { $ref: "../components/securitySchemes.yaml#/responses/Unauthorized" }
      "403":
        { $ref: "../components/securitySchemes.yaml#/responses/ForbiddenAdmin" }
  post:
    tags: [Students]
    summary: Créer un étudiant
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, email, password]
            properties:
              name: { type: string, example: Jean Rakoto }
              email: { type: string, format: email }
              password:
                {
                  type: string,
                  description: Mot de passe initial (haché en bcrypt côté serveur),
                }
    responses:
      "201":
        description: Étudiant créé
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/schemas/Student" }
      "400":
        { $ref: "../components/securitySchemes.yaml#/responses/BadRequest" }
      "401":
        { $ref: "../components/securitySchemes.yaml#/responses/Unauthorized" }
      "403":
        { $ref: "../components/securitySchemes.yaml#/responses/ForbiddenAdmin" }
      "409":
        description: Email déjà utilisé ("Email already in use")
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/schemas/Error" }

/students/{id}:
  parameters:
    - $ref: "../components/securitySchemes.yaml#/parameters/Id"
  put:
    tags: [Students]
    summary: Modifier un étudiant (password optionnel = réinitialisation)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, email]
            properties:
              name: { type: string }
              email: { type: string, format: email }
              is_active: { type: boolean }
              password:
                type: string
                description: Si présent, réinitialise le mot de passe
    responses:
      "200":
        description: Étudiant mis à jour
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/schemas/Student" }
      "400":
        { $ref: "../components/securitySchemes.yaml#/responses/BadRequest" }
      "401":
        { $ref: "../components/securitySchemes.yaml#/responses/Unauthorized" }
      "403":
        { $ref: "../components/securitySchemes.yaml#/responses/ForbiddenAdmin" }
      "404": { $ref: "../components/securitySchemes.yaml#/responses/NotFound" }
      "409":
        description: Email déjà utilisé par un autre compte
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/schemas/Error" }
  delete:
    tags: [Students]
    summary: Désactiver un étudiant (jamais de suppression physique, RG-10)
    responses:
      "200":
        description: Compte désactivé (is_active = false)
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/schemas/Student" }
      "400":
        { $ref: "../components/securitySchemes.yaml#/responses/BadRequest" }
      "401":
        { $ref: "../components/securitySchemes.yaml#/responses/Unauthorized" }
      "403":
        { $ref: "../components/securitySchemes.yaml#/responses/ForbiddenAdmin" }
      "404": { $ref: "../components/securitySchemes.yaml#/responses/NotFound" }
