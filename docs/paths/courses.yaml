/courses:
  get:
    tags: [Courses]
    summary: Liste des cours
    responses:
      "200":
        description: Cours avec leur nombre d'examens
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "../components/schemas.yaml#/schemas/Course" }
      "401":
        { $ref: "../components/securitySchemes.yaml#/responses/Unauthorized" }
      "403":
        { $ref: "../components/securitySchemes.yaml#/responses/ForbiddenAdmin" }
  post:
    tags: [Courses]
    summary: Créer un cours
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code, name]
            properties:
              code: { type: string, example: PROG2 }
              name: { type: string, example: Programmation web }
              description: { type: string, nullable: true }
    responses:
      "201":
        description: Cours cré
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/schemas/Course" }
      "400":
        { $ref: "../components/securitySchemes.yaml#/responses/BadRequest" }
      "401":
        { $ref: "../components/securitySchemes.yaml#/responses/Unauthorized" }
      "403":
        { $ref: "../components/securitySchemes.yaml#/responses/ForbiddenAdmin" }
      "409":
        description: Code de cours déjà utilisé ("Course code already in use")
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/schemas/Error" }

/courses/{id}:
  parameters:
    - $ref: "../components/securitySchemes.yaml#/parameters/Id"
  put:
    tags: [Courses]
    summary: Modifier un cours
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code, name]
            properties:
              code: { type: string }
              name: { type: string }
              description: { type: string, nullable: true }
    responses:
      "200":
        description: Cours mis à jour
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/schemas/Course" }
      "400":
        { $ref: "../components/securitySchemes.yaml#/responses/BadRequest" }
      "401":
        { $ref: "../components/securitySchemes.yaml#/responses/Unauthorized" }
      "403":
        { $ref: "../components/securitySchemes.yaml#/responses/ForbiddenAdmin" }
      "404": { $ref: "../components/securitySchemes.yaml#/responses/NotFound" }
      "409":
        description: Code déjà utilisé par un autre cours
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/schemas/Error" }
  delete:
    tags: [Courses]
    summary: Supprimer un cours (refusé s'il possède des examens, RG-09)
    responses:
      "200":
        description: Cours supprimé
      "400":
        { $ref: "../components/securitySchemes.yaml#/responses/BadRequest" }
      "401":
        { $ref: "../components/securitySchemes.yaml#/responses/Unauthorized" }
      "403":
        { $ref: "../components/securitySchemes.yaml#/responses/ForbiddenAdmin" }
      "404": { $ref: "../components/securitySchemes.yaml#/responses/NotFound" }
      "409":
        description: Le cours possède des examens ("Cannot delete a course that has exams")
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/schemas/Error" }
