/my/exams:
  get:
    tags: [My]
    summary: Examens disponibles pour l'étudiant connecté (fenêtre ouverte, non passés)
    responses:
      "200":
        description: Liste possiblement vide
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "../components/schemas.yaml#/schemas/MyExam" }
      "401":
        { $ref: "../components/securitySchemes.yaml#/responses/Unauthorized" }
      "403":
        {
          $ref: "../components/securitySchemes.yaml#/responses/ForbiddenStudent",
        }

/my/exams/{id}:
  parameters:
    - $ref: "../components/securitySchemes.yaml#/parameters/Id"
  get:
    tags: [My]
    summary: Détail d'un examen à passer (sans is_correct — RG-07)
    responses:
      "200":
        description: Examen avec questions et choix (id et texte uniquement)
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/schemas/MyExamDetail" }
      "400":
        { $ref: "../components/securitySchemes.yaml#/responses/BadRequest" }
      "401":
        { $ref: "../components/securitySchemes.yaml#/responses/Unauthorized" }
      "403":
        description: Fenêtre fermée ("Exam is not available") ou mauvais rôle
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/schemas/Error" }
      "404": { $ref: "../components/securitySchemes.yaml#/responses/NotFound" }
      "409":
        description: Examen déjà passé ("Exam already taken")
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/schemas/Error" }

/my/exams/{id}/submit:
  parameters:
    - $ref: "../components/securitySchemes.yaml#/parameters/Id"
  post:
    tags: [My]
    summary: Soumettre ses réponses (note calculée côté serveur — RG-05/06)
    description: >
      Les questions absentes du tableau valent 0 point (soumission partielle
      autorisée). Chaque question_id doit appartenir à l'examen, chaque
      choice_id à sa question, sans doublon de question_id.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [answers]
            properties:
              answers:
                type: array
                items:
                  type: object
                  required: [question_id, choice_id]
                  properties:
                    question_id: { type: integer, example: 1 }
                    choice_id: { type: integer, example: 3 }
    responses:
      "201":
        description: Tentative enregistrée, note et correction complète (RG-12)
        content:
          application/json:
            schema:
              type: object
              properties:
                score: { type: integer, example: 2 }
                total_points: { type: integer, example: 5 }
                correction:
                  type: array
                  description: Une entrée par question de l'examen, dans l'ordre
                  items:
                    {
                      $ref: "../components/schemas.yaml#/schemas/CorrectionLine",
                    }
      "400":
        description: Réponses invalides (choix d'une autre question, question d'un autre examen, doublon, tableau manquant)
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/schemas/Error" }
      "401":
        { $ref: "../components/securitySchemes.yaml#/responses/Unauthorized" }
      "403":
        description: Fenêtre fermée ("Exam is not available") ou mauvais rôle
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/schemas/Error" }
      "404": { $ref: "../components/securitySchemes.yaml#/responses/NotFound" }
      "409":
        description: Déjà soumis ("Exam already taken" — RG-02)
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/schemas/Error" }

/my/results:
  get:
    tags: [My]
    summary: Historique des résultats de l'étudiant connecté
    responses:
      "200":
        description: Tentatives triées de la plus récente à la plus ancienne
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  exam_id: { type: integer }
                  title: { type: string }
                  course_code: { type: string, example: PROG2 }
                  score: { type: integer }
                  total_points: { type: integer }
                  submitted_at: { type: string, format: date-time }
      "401":
        { $ref: "../components/securitySchemes.yaml#/responses/Unauthorized" }
      "403":
        {
          $ref: "../components/securitySchemes.yaml#/responses/ForbiddenStudent",
        }
