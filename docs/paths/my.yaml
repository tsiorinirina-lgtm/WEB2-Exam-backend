myExamsCollection:
  get:
    tags: [Student]
    summary: Get my exams
    security:
      - bearerAuth: []
    responses:
      "200":
        description: "Exams currently open (RG-03)"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../openapi.yaml#/components/schemas/Exam"
      "401":
        description: Missing or invalid token
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
myExamsItem:
  parameters:
    - in: path
      required: true
      name: id
      description: Exam ID
      schema:
        type: string
        format: uuid
        example: c970740e-1386-4388-b5b5-15f2689df843
  get:
    tags: [Student]
    summary: Get an exam
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Exam found
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ExamWithQuestions"
      "401":
        description: Missing or invalid token
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "404":
        description: Exam not found
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "409":
        description: "Outside exam window (RG-03)"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
myExamSubmit:
  parameters:
    - in: path
      required: true
      name: id
      description: Exam ID
      schema:
        type: string
        format: uuid
        example: c970740e-1386-4388-b5b5-15f2689df843
  post:
    tags: [Student]
    summary: Submit an exam
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/SubmissionDTO"
    responses:
      "201":
        description: Attempt recorded
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Result"
      "401":
        description: Missing or invalid token
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "404":
        description: Exam not found
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "409":
        description: "Already attempted (RG-02) or outside exam window (RG-03)"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "422":
        description: Invalid Data
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
myResultsCollection:
  get:
    tags: [Student]
    summary: Get my results
    security:
      - bearerAuth: []
    responses:
      "200":
        description: List of results
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../openapi.yaml#/components/schemas/Result"
      "401":
        description: Missing or invalid token
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
